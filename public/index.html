<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture de documents</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;650;700&display=swap" rel="stylesheet">
<style>
  /* Design tokens — livraison designer 2026-09-14 */
  :root {
    color-scheme: light;
    --dp-bg: #F7F5EF;
    --dp-surface: #FFFFFF;
    --dp-surface-muted: #EEECE5;
    --dp-ink: #202522;
    --dp-ink-soft: #68706B;
    --dp-ink-faint: #929993;
    --dp-line: #D8D8D0;
    --dp-primary: #2457D6;
    --dp-primary-hover: #1D47B4;
    --dp-primary-soft: #E8EEFF;
    --dp-warning: #A86200;
    --dp-warning-soft: #FFF2DD;
    --dp-error: #B42318;
    --dp-error-soft: #FDECEC;
    --dp-radius-sm: 8px;
    --dp-radius-md: 12px;
    --dp-radius-lg: 16px;
    --dp-space-1: 4px;
    --dp-space-2: 8px;
    --dp-space-3: 12px;
    --dp-space-4: 16px;
    --dp-space-5: 20px;
    --dp-space-6: 24px;
    --dp-space-7: 32px;
    --dp-space-8: 40px;
    --dp-font-ui: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--dp-bg); color: var(--dp-ink); font-family: var(--dp-font-ui); }

  .dp-app { max-width: 760px; margin: auto; padding: var(--dp-space-5) var(--dp-space-4) 40px; }

  /* Bandeau de marque */
  .dp-hero {
    background: var(--dp-primary-soft);
    padding: var(--dp-space-7) var(--dp-space-4) var(--dp-space-6);
  }
  .dp-header { max-width: 760px; margin: auto; text-align: center; }
  .dp-logo {
    display: inline-flex; align-items: center; gap: 12px;
    margin: 0; font-size: 25px; font-weight: 700; letter-spacing: -.015em; color: var(--dp-ink);
  }
  .dp-logo-mark {
    width: 42px; height: 42px; flex: none; display: grid; place-items: center;
    background: var(--dp-primary); border-radius: var(--dp-radius-md); color: #fff;
  }
  .dp-logo-mark svg { width: 24px; height: 24px; }
  .dp-tagline { margin: var(--dp-space-2) 0 0; font-size: 22px; font-weight: 550; letter-spacing: -.005em; color: var(--dp-ink); }

  [hidden] { display: none !important; }

  /* Zone de dépôt */
  .dp-dropzone {
    min-height: 180px; display: grid; place-items: center; text-align: center;
    padding: var(--dp-space-6); background: var(--dp-surface);
    border: 1.5px dashed #AEB3AE; border-radius: var(--dp-radius-lg);
    cursor: pointer; transition: border-color .15s, background .15s, opacity .15s;
  }
  .dp-dropzone.drag-over { border-color: var(--dp-primary); background: var(--dp-primary-soft); }
  .dp-dropzone.is-disabled { opacity: .55; pointer-events: none; }
  .dp-dropzone-copy { max-width: 280px; color: var(--dp-ink-soft); font-size: 15px; line-height: 1.45; margin: 0 auto; }
  .dp-icon { width: 32px; height: 32px; display: block; margin: 0 auto var(--dp-space-3); color: var(--dp-ink-faint); }

  /* display:none sur un input file empêche parfois Safari iOS de conserver
     la photo capturée au retour de l'appareil — on le rend invisible sans
     le retirer du rendu. */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* Boutons */
  .dp-actions { display: flex; flex-wrap: wrap; gap: var(--dp-space-2); align-items: center; margin-top: var(--dp-space-4); }
  .dp-button {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; border-radius: var(--dp-radius-sm); padding: 10px 14px;
    border: 1px solid transparent; font: 600 14px/1 var(--dp-font-ui); cursor: pointer;
  }
  .dp-button svg { width: 16px; height: 16px; flex: none; }
  .dp-button-primary { background: var(--dp-primary); color: #fff; }
  .dp-button-primary:hover { background: var(--dp-primary-hover); }
  .dp-button-secondary { background: var(--dp-surface); color: var(--dp-ink); border-color: var(--dp-line); }
  .dp-button-secondary:hover { background: var(--dp-surface-muted); }

  /* État de chargement */
  .dp-status { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: var(--dp-space-5); color: var(--dp-ink-soft); font-size: 14px; }
  .dp-spinner { width: 18px; height: 18px; border: 2px solid #D7DCE8; border-top-color: var(--dp-primary); border-radius: 50%; animation: dp-spin .8s linear infinite; flex: none; }
  @keyframes dp-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .dp-spinner { animation-duration: 2.4s; } }

  /* Erreur */
  .dp-error {
    display: flex; align-items: center; gap: 10px; margin-top: var(--dp-space-5);
    padding: 12px 14px; border: 1px solid #F3C5C1; background: var(--dp-error-soft);
    color: var(--dp-error); border-radius: var(--dp-radius-md); font-size: 14px;
  }
  .dp-error svg { width: 20px; height: 20px; flex: none; }

  /* Résultat */
  .dp-result { margin-top: var(--dp-space-7); }
  .dp-fields {
    display: grid; grid-template-columns: 1fr 1fr; gap: var(--dp-space-3);
    padding: var(--dp-space-4); background: var(--dp-surface); border: 1px solid var(--dp-line);
    border-radius: var(--dp-radius-md); margin: 0 0 var(--dp-space-4);
  }
  .dp-field dt { margin: 0 0 3px; color: var(--dp-ink-faint); font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; }
  .dp-field dd { margin: 0; font-size: 14px; font-weight: 550; }
  .dp-confidence-low { color: var(--dp-warning); }

  .dp-table-wrap { overflow: auto; background: var(--dp-surface); border: 1px solid var(--dp-line); border-radius: var(--dp-radius-md); }
  .dp-table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 13px; }
  .dp-table th { background: var(--dp-surface-muted); color: var(--dp-ink-soft); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; text-align: left; }
  .dp-table th, .dp-table td { padding: 10px 12px; border-bottom: 1px solid #ECECE6; }
  .dp-table td.num, .dp-table th.num { text-align: right; }
  .dp-table tr:last-child td { border-bottom: 0; }

  @media (max-width: 480px) {
    .dp-app { padding: var(--dp-space-4) var(--dp-space-3) 32px; }
    .dp-hero { padding: var(--dp-space-6) var(--dp-space-3) var(--dp-space-5); }
    .dp-fields { grid-template-columns: 1fr; }
    .dp-logo { font-size: 21px; gap: 10px; }
    .dp-logo-mark { width: 36px; height: 36px; }
    .dp-logo-mark svg { width: 20px; height: 20px; }
    .dp-tagline { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="dp-hero">
  <header class="dp-header">
    <h1 class="dp-logo">
      <span class="dp-logo-mark" aria-hidden="true">
        <svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <rect x="0.85" y="0.85" width="18.3" height="22.3" rx="2.6"/>
          <line x1="4" y1="7" x2="14" y2="7" stroke-opacity=".6" stroke-width="1.4"/>
          <line x1="4" y1="10.3" x2="11" y2="10.3" stroke-opacity=".6" stroke-width="1.4"/>
          <line x1="3.5" y1="14.2" x2="16.5" y2="14.2" stroke-dasharray="1.5 2.1" stroke-width="1.6"/>
          <g stroke="none" fill="currentColor">
            <rect x="4" y="17" width="5.2" height="2.9" rx="1"/>
            <rect x="10.5" y="17" width="5.2" height="2.9" rx="1"/>
            <rect x="4" y="20.9" width="5.2" height="2.9" rx="1"/>
            <rect x="10.5" y="20.9" width="5.2" height="2.9" rx="1"/>
          </g>
        </svg>
      </span>
      DemoProd
    </h1>
    <p class="dp-tagline">Lecture de documents</p>
  </header>
</div>
<div class="dp-app">
  <div class="dp-dropzone" id="zoneDepot">
    <div>
      <svg class="dp-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 21V7m0 0-5 5m5-5 5 5M8 18v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p class="dp-dropzone-copy">Glissez un document ici (PDF, JPG, PNG) — ou cliquez pour en choisir un</p>
      <input type="file" id="entreeFichier" class="visually-hidden" accept=".pdf,.jpg,.jpeg,.png,.webp">
    </div>
  </div>
  <div class="dp-actions">
    <button class="dp-button dp-button-secondary" id="boutonPhoto" type="button">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M9 10h3l2-3h4l2 3h3a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="17" r="4" stroke="currentColor" stroke-width="2"/></svg>
      Prendre une photo
    </button>
    <input type="file" id="entreePhoto" class="visually-hidden" accept="image/*" capture="environment">
  </div>

  <div class="dp-status" id="etat" hidden>
    <span class="dp-spinner" aria-hidden="true"></span>
    <span>Lecture du document…</span>
  </div>

  <div class="dp-error" id="erreur" hidden>
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 5 28 26H4L16 5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M16 12v7m0 3v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span id="texteErreur"></span>
  </div>

  <div class="dp-result" id="resultat" hidden>
    <dl class="dp-fields" id="champsEntete"></dl>
    <div class="dp-table-wrap">
      <table class="dp-table">
        <thead>
          <tr>
            <th>Désignation</th>
            <th class="num">Qté</th>
            <th class="num">Prix unitaire</th>
            <th class="num">Montant</th>
          </tr>
        </thead>
        <tbody id="corpsLignes"></tbody>
      </table>
    </div>
    <div class="dp-actions">
      <button class="dp-button dp-button-primary" id="boutonCsv" type="button">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 6v14m0 0-5-5m5 5 5-5M8 23v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Télécharger CSV
      </button>
      <button class="dp-button dp-button-secondary" id="boutonNouveau" type="button">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M25 10v6h-6M7 22v-6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 14a8 8 0 0 1 14.5-3M23 18a8 8 0 0 1-14.5 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Nouveau document
      </button>
    </div>
  </div>
</div>

<script>
const zoneDepot = document.getElementById('zoneDepot');
const entreeFichier = document.getElementById('entreeFichier');
const etat = document.getElementById('etat');
const erreur = document.getElementById('erreur');
const texteErreur = document.getElementById('texteErreur');
const resultat = document.getElementById('resultat');
const champsEntete = document.getElementById('champsEntete');
const corpsLignes = document.getElementById('corpsLignes');
const boutonCsv = document.getElementById('boutonCsv');
const boutonNouveau = document.getElementById('boutonNouveau');
const boutonPhoto = document.getElementById('boutonPhoto');
const entreePhoto = document.getElementById('entreePhoto');

let dernierResultat = null;

// Diagnostic : sur certains Android, l'appareil photo (lancé via <input
// capture>) fait recharger l'onglet en arrière-plan (le système libère la
// mémoire pendant que l'appli caméra tourne). Ce marqueur permet de
// distinguer ce cas — page relancée à vide — d'un vrai bug silencieux.
try {
  if (sessionStorage.getItem('dp-photo-en-cours')) {
    sessionStorage.removeItem('dp-photo-en-cours');
    afficherErreur("La prise de photo a fait recharger la page (mémoire système). Réessayez, ou utilisez « Glissez un document » pour choisir la photo dans votre galerie.");
  }
} catch (e) { /* sessionStorage indisponible (navigation privée) : tant pis */ }

zoneDepot.addEventListener('click', () => entreeFichier.click());
zoneDepot.addEventListener('dragover', (e) => { e.preventDefault(); zoneDepot.classList.add('drag-over'); });
zoneDepot.addEventListener('dragleave', () => zoneDepot.classList.remove('drag-over'));
zoneDepot.addEventListener('drop', (e) => {
  e.preventDefault();
  zoneDepot.classList.remove('drag-over');
  if (e.dataTransfer.files.length) traiter(e.dataTransfer.files[0]);
});
entreeFichier.addEventListener('change', () => {
  if (entreeFichier.files.length) traiter(entreeFichier.files[0]);
});

boutonPhoto.addEventListener('click', () => {
  try { sessionStorage.setItem('dp-photo-en-cours', '1'); } catch (e) { /* tant pis */ }
  entreePhoto.click();
});
entreePhoto.addEventListener('change', () => {
  try { sessionStorage.removeItem('dp-photo-en-cours'); } catch (e) { /* tant pis */ }
  if (entreePhoto.files.length) traiter(entreePhoto.files[0]);
});

boutonNouveau.addEventListener('click', reinitialiser);
boutonCsv.addEventListener('click', telechargerCsv);

function reinitialiser() {
  resultat.hidden = true;
  erreur.hidden = true;
  entreeFichier.value = '';
  dernierResultat = null;
}

async function traiter(fichier) {
  reinitialiser();

  zoneDepot.classList.add('is-disabled');
  etat.hidden = false;

  const donnees = new FormData();
  donnees.append('document', fichier);

  try {
    const reponse = await fetch('analyser.php', { method: 'POST', body: donnees });
    const corps = await reponse.json();
    etat.hidden = true;
    zoneDepot.classList.remove('is-disabled');

    if (!corps.succes) {
      afficherErreur(corps.erreur || "Échec de la lecture.");
      return;
    }

    afficherResultat(corps.champs);
  } catch (e) {
    etat.hidden = true;
    zoneDepot.classList.remove('is-disabled');
    afficherErreur("Connexion impossible.");
  }
}

function afficherErreur(message) {
  texteErreur.textContent = message;
  erreur.hidden = false;
}

function afficherResultat(champs) {
  dernierResultat = champs;

  const entetes = [
    ['Fournisseur', champs.fournisseur],
    ['N° document', champs.numero_document],
    ['Date', champs.date],
    ['Total HT', formaterMontant(champs.total_ht, true)],
    ['TVA', formaterMontant(champs.tva, true)],
    ['Total TTC', formaterMontant(champs.total_ttc, true)],
  ];

  champsEntete.innerHTML = entetes.map(([libelle, valeur]) => `
    <div class="dp-field">
      <dt>${libelle}</dt>
      <dd>${valeur || '—'}</dd>
    </div>
  `).join('');

  if (champs.confiance === 'basse') {
    champsEntete.innerHTML += `
      <div class="dp-field">
        <dt>Confiance</dt>
        <dd class="dp-confidence-low">basse</dd>
      </div>`;
  }

  const lignes = champs.lignes || [];
  corpsLignes.innerHTML = lignes.length
    ? lignes.map(l => `
        <tr>
          <td>${l.designation || '—'}</td>
          <td class="num">${l.quantite ?? ''}</td>
          <td class="num">${formaterMontant(l.prix_unitaire)}</td>
          <td class="num">${formaterMontant(l.montant)}</td>
        </tr>
      `).join('')
    : '<tr><td colspan="4">Aucune ligne détectée.</td></tr>';

  resultat.hidden = false;
}

function formaterMontant(valeur, avecDevise) {
  if (valeur === undefined || valeur === null || valeur === '') return '';
  const nombre = Number(valeur);
  if (!Number.isFinite(nombre)) return String(valeur);
  const texte = nombre.toFixed(2);
  return avecDevise ? texte + ' €' : texte;
}

function telechargerCsv() {
  if (!dernierResultat) return;
  const c = dernierResultat;
  const lignesCsv = [];

  lignesCsv.push(['Fournisseur', 'N° document', 'Date', 'Total HT', 'TVA', 'Total TTC'].join(';'));
  lignesCsv.push([c.fournisseur, c.numero_document, c.date, c.total_ht, c.tva, c.total_ttc]
    .map(champCsv).join(';'));
  lignesCsv.push('');
  lignesCsv.push(['Désignation', 'Quantité', 'Prix unitaire', 'Montant'].join(';'));
  (c.lignes || []).forEach(l => {
    lignesCsv.push([l.designation, l.quantite, l.prix_unitaire, l.montant].map(champCsv).join(';'));
  });

  const contenu = '﻿' + lignesCsv.join('\r\n');
  const blob = new Blob([contenu], { type: 'text/csv;charset=utf-8' });
  const lien = document.createElement('a');
  lien.href = URL.createObjectURL(blob);
  lien.download = 'document-extrait.csv';
  lien.click();
  URL.revokeObjectURL(lien.href);
}

function champCsv(valeur) {
  if (valeur === undefined || valeur === null) return '';
  const texte = String(valeur);
  return /[;"\n]/.test(texte) ? '"' + texte.replace(/"/g, '""') + '"' : texte;
}
</script>
</body>
</html>
